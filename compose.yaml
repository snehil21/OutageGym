services:
  floci:
    image: floci/floci:2.3.0
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      FLOCI_DEFAULT_REGION: us-east-1
      FLOCI_DEFAULT_ACCOUNT_ID: "000000000000"
      FLOCI_HOSTNAME: floci
      FLOCI_BASE_URL: http://floci:4566
      FLOCI_STORAGE_MODE: memory
    networks:
      - lab

  order-api:
    build:
      context: .
      dockerfile: services/order-api/Dockerfile
    image: outagegym/order-api:local
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_REGION: us-east-1
      ORDER_QUEUE_URL: http://floci:4566/000000000000/outagegym-inc-001-orders
    depends_on:
      floci:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health').then(response=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - lab

  order-worker:
    build:
      context: .
      dockerfile: services/order-worker/Dockerfile
    image: outagegym/order-worker:local
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_REGION: us-east-1
      ORDER_QUEUE_URL: http://floci:4566/000000000000/outagegym-inc-001-orders
      ORDERS_TABLE_NAME: outagegym-inc-001-orders
      SQS_WAIT_TIME_SECONDS: "10"
    depends_on:
      floci:
        condition: service_healthy
    stop_grace_period: 15s
    networks:
      - lab

  aws:
    image: floci/floci:2.3.0-compat
    profiles:
      - tools
    entrypoint:
      - aws
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: outagegym-local
      AWS_SECRET_ACCESS_KEY: outagegym-local-only
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_PAGER: ""
    depends_on:
      floci:
        condition: service_healthy
    networks:
      - lab

  terraform:
    image: hashicorp/terraform:1.16.6
    profiles:
      - tools
    working_dir: /workspace
    volumes:
      - ./infra/terraform:/workspace
    environment:
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: outagegym-local
      AWS_SECRET_ACCESS_KEY: outagegym-local-only
      AWS_EC2_METADATA_DISABLED: "true"
      CHECKPOINT_DISABLE: "1"
      TF_IN_AUTOMATION: "true"
    depends_on:
      floci:
        condition: service_healthy
    networks:
      - lab

  node:
    image: node:22.23.3-alpine3.24
    profiles:
      - tools
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    networks:
      - lab

networks:
  lab:
    driver: bridge
