services:
  floci:
    image: floci/floci:2.3.0
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      FLOCI_DEFAULT_REGION: us-east-1
      FLOCI_DEFAULT_ACCOUNT_ID: "000000000000"
      FLOCI_HOSTNAME: floci
      FLOCI_BASE_URL: http://floci:4566
      FLOCI_STORAGE_MODE: memory
    networks:
      - lab

  prometheus:
    image: prom/prometheus:v3.15.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:9090/-/ready
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - lab

  loki:
    image: grafana/loki:3.7.8
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
    command:
      - -config.file=/etc/loki/loki.yml
    healthcheck:
      test:
        - CMD
        - /usr/bin/loki
        - -health
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - lab

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    ports:
      - "127.0.0.1:13133:13133"
    expose:
      - "4317"
      - "4318"
      - "9464"
    volumes:
      - ./observability/opentelemetry/collector.yml:/etc/otelcol-contrib/config.yml:ro
    command:
      - --config=/etc/otelcol-contrib/config.yml
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - lab

  grafana:
    image: grafana/grafana:13.2.2
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:3000/api/health
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - lab

  order-api:
    build:
      context: .
      dockerfile: services/order-api/Dockerfile
    image: outagegym/order-api:local
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_REGION: us-east-1
      ORDER_PROCESSING_QUEUE_URL: http://floci:4566/000000000000/outagegym-${INCIDENT_ID:-inc-001}-order-processing
    depends_on:
      floci:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/ready').then(response=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - lab

  order-worker:
    build:
      context: .
      dockerfile: services/order-worker/Dockerfile
    image: outagegym/order-worker:local
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_REGION: us-east-1
      HEALTH_HOST: 0.0.0.0
      HEALTH_PORT: "3001"
      ORDER_PROCESSING_QUEUE_URL: http://floci:4566/000000000000/outagegym-${INCIDENT_ID:-inc-001}-order-processing
      ORDER_RECORDS_TABLE_NAME: outagegym-${INCIDENT_ID:-inc-001}-order-records
      SQS_RECEIVE_WAIT_TIME_SECONDS: "10"
    depends_on:
      floci:
        condition: service_healthy
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/ready').then(response=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - lab

  aws:
    image: floci/floci:2.3.0-compat
    profiles:
      - tools
    entrypoint:
      - aws
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: outagegym-local
      AWS_SECRET_ACCESS_KEY: outagegym-local-only
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_PAGER: ""
    depends_on:
      floci:
        condition: service_healthy
    networks:
      - lab

  terraform:
    image: hashicorp/terraform:1.16.6
    profiles:
      - tools
    working_dir: /workspace
    volumes:
      - ./infra/terraform:/workspace
    environment:
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: outagegym-local
      AWS_SECRET_ACCESS_KEY: outagegym-local-only
      AWS_EC2_METADATA_DISABLED: "true"
      CHECKPOINT_DISABLE: "1"
      TF_IN_AUTOMATION: "true"
      TF_VAR_incident_id: ${INCIDENT_ID:-inc-001}
    depends_on:
      floci:
        condition: service_healthy
    networks:
      - lab

  node:
    image: node:22.23.3-alpine3.24
    profiles:
      - tools
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      ORDER_API_URL: http://order-api:3000
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_REGION: us-east-1
      ORDER_PROCESSING_QUEUE_URL: http://floci:4566/000000000000/outagegym-${INCIDENT_ID:-inc-001}-order-processing
      ORDER_RECORDS_TABLE_NAME: outagegym-${INCIDENT_ID:-inc-001}-order-records
    networks:
      - lab

  k6:
    image: grafana/k6:2.3.0
    profiles:
      - tools
    working_dir: /workloads/k6
    volumes:
      - ./workloads:/workloads:ro
    environment:
      ORDER_API_URL: http://order-api:3000
    depends_on:
      order-api:
        condition: service_healthy
    networks:
      - lab

networks:
  lab:
    driver: bridge
