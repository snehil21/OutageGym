x-outagegym-host-bindings:
  floci: &floci-host-binding "${OUTAGEGYM_BIND_ADDRESS:-127.0.0.1}:${FLOCI_HOST_PORT:-4566}:4566"
  prometheus: &prometheus-host-binding "${OUTAGEGYM_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_HOST_PORT:-9090}:9090"
  loki: &loki-host-binding "${OUTAGEGYM_BIND_ADDRESS:-127.0.0.1}:${LOKI_HOST_PORT:-3100}:3100"
  otel-health: &otel-health-host-binding "${OUTAGEGYM_BIND_ADDRESS:-127.0.0.1}:${OTEL_HEALTH_HOST_PORT:-13133}:13133"
  grafana: &grafana-host-binding "${OUTAGEGYM_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_HOST_PORT:-3002}:3000"
  order-api: &order-api-host-binding "${OUTAGEGYM_BIND_ADDRESS:-127.0.0.1}:${ORDER_API_HOST_PORT:-3000}:3000"

x-outagegym-runtime:
  aws-endpoint-url: &aws-endpoint-url http://floci:4566
  aws-region: &aws-region us-east-1
  aws-access-key-id: &aws-access-key-id outagegym-local
  aws-secret-access-key: &aws-secret-access-key outagegym-local-only
  order-api-url: &order-api-url http://order-api:3000
  otlp-endpoint-url: &otlp-endpoint-url http://otel-collector:4318
  prometheus-url: &prometheus-url http://prometheus:9090
  loki-url: &loki-url http://loki:3100
  loki-otlp-url: &loki-otlp-url http://loki:3100/otlp
  otel-health-url: &otel-health-url http://otel-collector:13133
  grafana-url: &grafana-url http://grafana:3000
  order-processing-queue-url: &order-processing-queue-url http://floci:4566/000000000000/outagegym-${INCIDENT_ID:-inc-001}-order-processing
  order-records-table-name: &order-records-table-name outagegym-${INCIDENT_ID:-inc-001}-order-records
  prometheus-health-url: &prometheus-health-url http://127.0.0.1:9090/-/ready
  grafana-health-url: &grafana-health-url http://127.0.0.1:3000/api/health
  order-api-health-command: &order-api-health-command fetch('http://127.0.0.1:3000/ready').then(response=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))
  order-worker-health-command: &order-worker-health-command fetch('http://127.0.0.1:3001/ready').then(response=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))
  notification-worker-health-command: &notification-worker-health-command fetch('http://127.0.0.1:3003/ready').then(response=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))
  order-completion-event-bus-name: &order-completion-event-bus-name outagegym-${INCIDENT_ID:-inc-001}-notification-events
  notification-queue-url: &notification-queue-url http://floci:4566/000000000000/outagegym-${INCIDENT_ID:-inc-001}-notification-delivery
  notification-records-table-name: &notification-records-table-name outagegym-${INCIDENT_ID:-inc-001}-notification-records

services:
  floci:
    image: floci/floci:2.3.0
    ports:
      - *floci-host-binding
    environment:
      FLOCI_DEFAULT_REGION: *aws-region
      FLOCI_DEFAULT_ACCOUNT_ID: "000000000000"
      FLOCI_HOSTNAME: floci
      FLOCI_BASE_URL: *aws-endpoint-url
      FLOCI_STORAGE_MODE: memory
    networks:
      - lab

  prometheus:
    image: prom/prometheus:v3.15.0
    ports:
      - *prometheus-host-binding
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - *prometheus-health-url
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - lab

  loki:
    image: grafana/loki:3.7.8
    ports:
      - *loki-host-binding
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    command:
      - -config.file=/etc/loki/loki.yml
    healthcheck:
      test:
        - CMD
        - /usr/bin/loki
        - -health
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - lab

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    ports:
      - *otel-health-host-binding
    expose:
      - "4317"
      - "4318"
      - "9464"
    volumes:
      - ./observability/opentelemetry/collector.yml:/etc/otelcol-contrib/config.yml:ro
    environment:
      LOKI_OTLP_ENDPOINT: *loki-otlp-url
    command:
      - --config=/etc/otelcol-contrib/config.yml
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - lab

  grafana:
    image: grafana/grafana:13.2.2
    ports:
      - *grafana-host-binding
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
      PROMETHEUS_URL: *prometheus-url
      LOKI_URL: *loki-url
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - *grafana-health-url
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - lab

  order-api:
    build:
      context: .
      dockerfile: services/order-api/Dockerfile
    image: outagegym/order-api:local
    ports:
      - *order-api-host-binding
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      AWS_ENDPOINT_URL: *aws-endpoint-url
      AWS_REGION: *aws-region
      OTEL_EXPORTER_OTLP_ENDPOINT: *otlp-endpoint-url
      ORDER_PROCESSING_QUEUE_URL: *order-processing-queue-url
    depends_on:
      floci:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - *order-api-health-command
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - lab

  order-worker:
    build:
      context: .
      dockerfile: services/order-worker/Dockerfile
    image: outagegym/order-worker:local
    environment:
      AWS_ENDPOINT_URL: *aws-endpoint-url
      AWS_REGION: *aws-region
      HEALTH_HOST: 0.0.0.0
      HEALTH_PORT: "3001"
      ORDER_PROCESSING_QUEUE_URL: *order-processing-queue-url
      ORDER_RECORDS_TABLE_NAME: *order-records-table-name
      OTEL_EXPORTER_OTLP_ENDPOINT: *otlp-endpoint-url
      SQS_RECEIVE_WAIT_TIME_SECONDS: "10"
      ORDER_STORAGE_REVISION: ${ORDER_STORAGE_REVISION:-2}
      ORDER_PROCESSING_DURATION_MS: ${ORDER_PROCESSING_DURATION_MS:-0}
      BULK_ORDER_MIN_QUANTITY: ${BULK_ORDER_MIN_QUANTITY:-100}
      BULK_ORDER_PROCESSING_DURATION_MS: ${BULK_ORDER_PROCESSING_DURATION_MS:-0}
      ORDER_COMPLETION_EVENT_BUS_NAME: ${ORDER_COMPLETION_EVENT_BUS_NAME:-}
    depends_on:
      floci:
        condition: service_healthy
    stop_grace_period: 15s
    deploy:
      replicas: ${ORDER_WORKER_REPLICAS:-1}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - *order-worker-health-command
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - lab

  notification-worker:
    build:
      context: .
      dockerfile: services/notification-worker/Dockerfile
    image: outagegym/notification-worker:local
    profiles:
      - notifications
    environment:
      AWS_ENDPOINT_URL: *aws-endpoint-url
      AWS_REGION: *aws-region
      HEALTH_HOST: 0.0.0.0
      HEALTH_PORT: "3003"
      NOTIFICATION_QUEUE_URL: *notification-queue-url
      NOTIFICATION_RECORDS_TABLE_NAME: *notification-records-table-name
      OTEL_EXPORTER_OTLP_ENDPOINT: *otlp-endpoint-url
      SQS_RECEIVE_WAIT_TIME_SECONDS: "10"
    depends_on:
      floci:
        condition: service_healthy
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - *notification-worker-health-command
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - lab

  aws:
    image: floci/floci:2.3.0-compat
    profiles:
      - tools
    entrypoint:
      - aws
    environment:
      AWS_ENDPOINT_URL: *aws-endpoint-url
      AWS_DEFAULT_REGION: *aws-region
      AWS_REGION: *aws-region
      AWS_ACCESS_KEY_ID: *aws-access-key-id
      AWS_SECRET_ACCESS_KEY: *aws-secret-access-key
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_PAGER: ""
    depends_on:
      floci:
        condition: service_healthy
    networks:
      - lab

  terraform:
    image: hashicorp/terraform:1.16.6
    profiles:
      - tools
    working_dir: /workspace
    volumes:
      - ./infra/terraform:/workspace
    environment:
      AWS_DEFAULT_REGION: *aws-region
      AWS_REGION: *aws-region
      AWS_ACCESS_KEY_ID: *aws-access-key-id
      AWS_SECRET_ACCESS_KEY: *aws-secret-access-key
      AWS_EC2_METADATA_DISABLED: "true"
      CHECKPOINT_DISABLE: "1"
      TF_IN_AUTOMATION: "true"
      TF_VAR_aws_endpoint_url: *aws-endpoint-url
      TF_VAR_incident_id: ${INCIDENT_ID:-inc-001}
      TF_VAR_order_processing_visibility_timeout_seconds: ${ORDER_PROCESSING_VISIBILITY_TIMEOUT_SECONDS:-30}
    depends_on:
      floci:
        condition: service_healthy
    networks:
      - lab

  node:
    image: node:22.23.3-alpine3.24
    profiles:
      - tools
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      ORDER_API_URL: *order-api-url
      AWS_ENDPOINT_URL: *aws-endpoint-url
      AWS_REGION: *aws-region
      ORDER_PROCESSING_QUEUE_URL: *order-processing-queue-url
      ORDER_RECORDS_TABLE_NAME: *order-records-table-name
      ORDER_COMPLETION_EVENT_BUS_NAME: *order-completion-event-bus-name
      NOTIFICATION_QUEUE_URL: *notification-queue-url
      NOTIFICATION_RECORDS_TABLE_NAME: *notification-records-table-name
      PROMETHEUS_URL: *prometheus-url
      LOKI_URL: *loki-url
      OTEL_COLLECTOR_HEALTH_URL: *otel-health-url
      GRAFANA_URL: *grafana-url
    networks:
      - lab

  scenario-validator:
    build:
      context: ./scripts/scenario-validator
    image: outagegym/scenario-validator:local
    profiles:
      - tools
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
    network_mode: none

  grader:
    build:
      context: .
      dockerfile: grader/Dockerfile
    image: outagegym/grader:local
    profiles:
      - tools
    environment:
      AWS_ENDPOINT_URL: *aws-endpoint-url
      AWS_REGION: *aws-region
      AWS_ACCESS_KEY_ID: *aws-access-key-id
      AWS_SECRET_ACCESS_KEY: *aws-secret-access-key
      AWS_EC2_METADATA_DISABLED: "true"
      INCIDENT_ID: ${INCIDENT_ID:-inc-001}
      ORDER_API_URL: *order-api-url
      ORDER_PROCESSING_QUEUE_URL: *order-processing-queue-url
      ORDER_RECORDS_TABLE_NAME: *order-records-table-name
    depends_on:
      floci:
        condition: service_healthy
    networks:
      - lab

  k6:
    image: grafana/k6:2.3.0
    profiles:
      - tools
    working_dir: /workloads/k6
    volumes:
      - ./workloads:/workloads:ro
      - ./scenarios:/scenarios:ro
    environment:
      ORDER_API_URL: *order-api-url
      INCIDENT_WORKLOAD_ARRIVAL_RATE: ${INCIDENT_WORKLOAD_ARRIVAL_RATE:-1}
      INCIDENT_WORKLOAD_DURATION_SECONDS: ${INCIDENT_WORKLOAD_DURATION_SECONDS:-10}
    depends_on:
      order-api:
        condition: service_healthy
    networks:
      - lab

networks:
  lab:
    driver: bridge

volumes:
  grafana-data:
  loki-data:
  prometheus-data:
