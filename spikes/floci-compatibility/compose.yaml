name: outagegym-floci-compatibility

services:
  floci:
    image: floci/floci:2.3.0
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      FLOCI_DEFAULT_REGION: us-east-1
      FLOCI_DEFAULT_ACCOUNT_ID: "000000000000"
      FLOCI_HOSTNAME: floci
      FLOCI_BASE_URL: http://floci:4566
      FLOCI_STORAGE_MODE: memory

  aws:
    image: floci/floci:2.3.0-compat
    profiles:
      - tools
    entrypoint:
      - aws
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: outagegym-local
      AWS_SECRET_ACCESS_KEY: outagegym-local-only
      AWS_EC2_METADATA_DISABLED: "true"
    depends_on:
      floci:
        condition: service_healthy

  node:
    image: node:22.23.3-alpine3.24
    profiles:
      - tools
    working_dir: /workspace
    volumes:
      - ./sdk-js:/workspace
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: outagegym-local
      AWS_SECRET_ACCESS_KEY: outagegym-local-only
      AWS_EC2_METADATA_DISABLED: "true"
    depends_on:
      floci:
        condition: service_healthy
