schema_version: 1
id: inc-003
title: Some checkout attempts fail or create duplicate orders
difficulty:
  level: intermediate
  interacting_causes: 2
  evidence_sources:
    - alerts
    - configuration
    - logs
    - metrics
    - resource_state
  repair_tradeoffs: true

resources:
  minimum_host:
    logical_cpu_cores: 4
    memory_gb: 4
    free_disk_gb: 6
  required_services:
    - floci
    - grafana
    - loki
    - order-api
    - order-worker
    - otel-collector
    - prometheus

documents:
  brief: brief.md
  evidence: evidence.md
  postmortem: postmortem-template.md

system:
  entrypoint: order-api
  processing_service: order-worker
  queue: order-processing
  store: order-records

commands:
  start: make start INCIDENT=inc-003
  status: make status INCIDENT=inc-003
  workload: make workload INCIDENT=inc-003
  reset: make reset INCIDENT=inc-003
  stop: make stop INCIDENT=inc-003

investigation:
  grafana_url: http://127.0.0.1:3002
  prometheus_url: http://127.0.0.1:9090
  loki_url: http://127.0.0.1:3100

initial_signal:
  type: customer_report
  name: CheckoutTimeoutsAndDuplicates
  condition: Some checkout attempts time out and retries create multiple orders

required_outcomes:
  - repeated checkout attempts for one customer intent create one order
  - clients receive a stable response when retrying an ambiguous request
  - checkout latency and error rate return to the healthy baseline
  - recovery survives an order-api restart
  - logs and metrics retain order, correlation and request identifiers
