name: Publish application images

on:
  workflow_call:
    inputs:
      version:
        description: Version tag applied to both application images
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Version tag, for example v0.1.0-beta.1
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ inputs.version }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: snehil21

jobs:
  validate-version:
    name: Validate image version
    runs-on: ubuntu-latest
    steps:
      - name: Require a versioned release tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like v0.1.0 or v0.1.0-beta.1." >&2
            exit 1
          fi

  publish:
    name: Publish ${{ matrix.service }}
    needs: validate-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: order-api
            dockerfile: services/order-api/Dockerfile
            image: outagegym-order-api
          - service: order-worker
            dockerfile: services/order-worker/Dockerfile
            image: outagegym-order-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish multi-architecture image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ inputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: mode=max
          sbom: true

      - name: Record immutable image reference
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p image-digests
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > "image-digests/${{ matrix.service }}.txt"

          {
            echo "### ${{ matrix.service }}"
            echo
            echo "Versioned reference: \`$IMAGE:$RELEASE_VERSION\`"
            echo
            echo "Immutable reference: \`$IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload image digest
        uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ matrix.service }}
          path: image-digests/${{ matrix.service }}.txt
          if-no-files-found: error
          retention-days: 7
