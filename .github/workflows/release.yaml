name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - name: Require a versioned release tag
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must look like v0.1.0 or v0.1.0-beta.1." >&2
            exit 1
          fi

  verify:
    name: Verify clean-machine runtime
    needs: validate-version
    uses: ./.github/workflows/ci.yaml

  images:
    name: Publish application images
    needs: verify
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-images.yaml
    with:
      version: ${{ github.ref_name }}

  release:
    name: Create GitHub release
    needs: images
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download image digests
        uses: actions/download-artifact@v7
        with:
          pattern: image-digest-*
          path: image-digests
          merge-multiple: true

      - name: Prepare release notes
        run: |
          cp .github/RELEASE_TEMPLATE.md release-notes.md
          {
            echo
            echo "## Application images"
            echo
            for digest_file in image-digests/*.txt; do
              echo "- \`$(cat "$digest_file")\`"
            done
          } >> release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          release_type=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            release_type+=(--prerelease)
          fi

          gh release create "$RELEASE_VERSION" \
            --verify-tag \
            --title "OutageGym $RELEASE_VERSION" \
            --notes-file release-notes.md \
            "${release_type[@]}"
